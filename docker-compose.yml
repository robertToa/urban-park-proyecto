services:
  db-espacios:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: db_espacios
      POSTGRES_USER: urban
      POSTGRES_PASSWORD: urban123
    volumes:
      - vol_espacios:/var/lib/postgresql/data
    networks: [urban-net]

  db-vehiculos:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: db_vehiculos
      POSTGRES_USER: urban
      POSTGRES_PASSWORD: urban123
    volumes:
      - vol_vehiculos:/var/lib/postgresql/data
    networks: [urban-net]

  db-tickets:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: db_tickets
      POSTGRES_USER: urban
      POSTGRES_PASSWORD: urban123
    volumes:
      - vol_tickets:/var/lib/postgresql/data
    networks: [urban-net]

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    hostname: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 80
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/urbanpark-realm.json:/opt/keycloak/data/import/urbanpark-realm.json
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks: [urban-net]

  ms-espacios:
    build: ./ms-espacios
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-espacios:5432/db_espacios
      SPRING_DATASOURCE_USERNAME: urban
      SPRING_DATASOURCE_PASSWORD: urban123
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/urbanpark/protocol/openid-connect/certs
    depends_on: [db-espacios, keycloak]
    networks: [urban-net]

  ms-vehiculos:
    build: ./ms-vehiculos
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-vehiculos:5432/db_vehiculos
      SPRING_DATASOURCE_USERNAME: urban
      SPRING_DATASOURCE_PASSWORD: urban123
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/urbanpark/protocol/openid-connect/certs
    depends_on: [db-vehiculos, keycloak]
    networks: [urban-net]

  ms-tickets:
    build: ./ms-tickets
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-tickets:5432/db_tickets
      SPRING_DATASOURCE_USERNAME: urban
      SPRING_DATASOURCE_PASSWORD: urban123
      ESPACIOS_URL: http://ms-espacios:8081
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/urbanpark/protocol/openid-connect/certs
    volumes:
      # Demo Resilience: botones stop/start de ms-espacios desde la UI (ADMIN)
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [db-tickets, ms-espacios, keycloak]
    networks: [urban-net]

  ms-ia:
    build: ./ms-ia
    environment:
      ESPACIOS_URL: http://ms-espacios:8081
      TICKETS_URL: http://ms-tickets:8083
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/urbanpark/protocol/openid-connect/certs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [ms-espacios, ms-tickets, keycloak]
    networks: [urban-net]

  ms-auth:
    build: ./ms-auth
    environment:
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: urbanpark
      KEYCLOAK_ADMIN_CLIENT_ID: urbanpark-backend
      KEYCLOAK_ADMIN_CLIENT_SECRET: urbanpark-secret
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/urbanpark/protocol/openid-connect/certs
    depends_on: [keycloak]
    networks: [urban-net]

  # Ollama opcional en Docker (solo si NO tienes Ollama en el host).
  # Arrancar con: docker compose --profile ollama-docker up --build
  ollama:
    profiles: ["ollama-docker"]
    image: ollama/ollama:latest
    # Sin mapear 11434 al host para no chocar con Ollama local
    volumes:
      - vol_ollama:/root/.ollama
    networks: [urban-net]

  ollama-init:
    profiles: ["ollama-docker"]
    image: curlimages/curl:8.5.0
    depends_on: [ollama]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Esperando Ollama..."
        i=0
        until curl -sf http://ollama:11434/api/tags >/dev/null; do
          i=$$((i+1))
          if [ "$$i" -gt 60 ]; then echo "Timeout esperando Ollama"; exit 1; fi
          sleep 2
        done
        echo "Descargando modelo $${OLLAMA_MODEL:-llama3.2:3b}..."
        curl -sf http://ollama:11434/api/pull -d "{\"name\":\"$${OLLAMA_MODEL:-llama3.2:3b}\"}"
        echo "Modelo listo"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    networks: [urban-net]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on: [ms-espacios, ms-vehiculos, ms-tickets, ms-ia, ms-auth, keycloak]
    restart: unless-stopped
    networks: [urban-net]

networks:
  urban-net:
    driver: bridge

volumes:
  vol_espacios:
  vol_vehiculos:
  vol_tickets:
  vol_ollama:
