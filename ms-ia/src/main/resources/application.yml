server:
  port: 8084
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: ms-ia
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8080/realms/urbanpark/protocol/openid-connect/certs}

espacios:
  url: ${ESPACIOS_URL:http://localhost:8081}

tickets:
  url: ${TICKETS_URL:http://localhost:8083}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3.2:3b}
  timeout-seconds: ${OLLAMA_TIMEOUT:90}
