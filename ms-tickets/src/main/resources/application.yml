server:
  port: 8083
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: ms-tickets
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/db_tickets}
    username: ${SPRING_DATASOURCE_USERNAME:urban}
    password: ${SPRING_DATASOURCE_PASSWORD:urban123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8080/realms/urbanpark/protocol/openid-connect/certs}
  cloud:
    openfeign:
      circuitbreaker:
        # Resilience4j solo en TicketService.ocupacionRemota (no en todo Feign)
        enabled: false

espacios:
  url: ${ESPACIOS_URL:http://localhost:8081}

resilience4j:
  circuitbreaker:
    instances:
      espaciosClient:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      espaciosClient:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
